

<div class="main-container">
    <h1 class="heading">Markdown Generator</h1>
    <form class="upload-form" (submit)="onSubmit($event)">
        <div class="upload-form-group">
            <label class-="upload-input-label" for="file-upload">Datei hochladen</label>
            <input class="upload-input" type="file" id="file-upload" (change)="onFileSelected($event)" multiple>
        </div>
        <button class="upload-form-button" type="submit" [disabled]="!selectedFiles.length">Upload</button>
    </form>
</div>
  

<router-outlet />
