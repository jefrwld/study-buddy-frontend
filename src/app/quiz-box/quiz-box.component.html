<form>
  <div *ngFor="let question of questions(); let i = index">
    <div *ngIf="i === visibleQuestion" class="question-card">
      <p>{{ question.question }}</p> 

      <div *ngFor="let option of ['A', 'B', 'C', 'D']">
        <div class="formgroup">
          <label class="question-option">{{ question[option] }}</label>
          <input 
            type="radio" 
            name="question{{i}}" 
            [value]="option"
            (change)="checkAnswer(i, option)"  
          >
        </div>
      </div>

      <div *ngIf="selectedAnswers[i]">
        <p *ngIf="selectedAnswers[i] === question.correct" class="correct">Correct!</p>
        <p *ngIf="selectedAnswers[i] !== question.correct" class="incorrect">Incorrect! Try again.</p>
      </div>
    </div>
  </div>
</form>
